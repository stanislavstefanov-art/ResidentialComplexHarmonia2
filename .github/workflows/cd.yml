name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-residence-harmonia-prod
  APP_SERVICE_NAME: residenceharmonia-api

jobs:
  deploy-api:
    needs: [run-schema]
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish API
        run: dotnet publish src/Harmonia.Api/Harmonia.Api.csproj -c Release -o ./publish

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          package: ./publish

  deploy-angular:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/angular/package-lock.json

      - name: Install dependencies
        working-directory: ui/angular
        run: npm ci --legacy-peer-deps

      - name: Build Angular
        working-directory: ui/angular
        run: npm run build -- --configuration production

      - name: Deploy to Angular SWA
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.ANGULAR_SWA_DEPLOY_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ui/angular/dist/harmonia-angular/browser
          skip_app_build: true

  deploy-react:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/react/package-lock.json

      - name: Install dependencies
        working-directory: ui/react
        run: npm ci

      - name: Build React
        working-directory: ui/react
        env:
          REACT_APP_API_URL: https://residenceharmonia-api.azurewebsites.net
        run: npm run build

      - name: Deploy to React SWA
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.REACT_SWA_DEPLOY_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ui/react/build
          skip_app_build: true

  run-schema:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install sqlcmd
        run: |
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -yq mssql-tools18 unixodbc-dev
          echo '/opt/mssql-tools18/bin' >> "$GITHUB_PATH"

      - name: Apply schema
        run: |
          CONN_STR=$(az keyvault secret show \
            --vault-name residenceharmoniakv \
            --name ConnectionStrings--Default \
            --query value -o tsv)
          echo "::add-mask::$CONN_STR"

          SQL_SERVER=$(CONN_VAR="$CONN_STR" python3 -c \
            "import os; cs=os.environ['CONN_VAR']; d={p.split('=',1)[0].strip():p.split('=',1)[1].strip() for p in cs.rstrip(';').split(';') if '=' in p}; print(d['Server'].replace('tcp:','').rsplit(',',1)[0])")

          SQL_PASS=$(CONN_VAR="$CONN_STR" python3 -c \
            "import os; cs=os.environ['CONN_VAR']; d={p.split('=',1)[0].strip():p.split('=',1)[1].strip() for p in cs.rstrip(';').split(';') if '=' in p}; print(d['Password'])")

          echo "::add-mask::$SQL_PASS"

          # Serverless DB auto-pauses; retry until it resumes (up to ~3 min)
          for i in $(seq 1 9); do
            SQLCMDPASSWORD="$SQL_PASS" sqlcmd \
              -S "$SQL_SERVER" \
              -d residenceharmonia-db \
              -U harmonia-admin \
              -i db/schema.sql \
              -b \
              -l 60 && break
            [ $i -lt 9 ] || exit 1
            echo "DB resuming (attempt $i/9), retrying in 20s..."
            sleep 20
          done
